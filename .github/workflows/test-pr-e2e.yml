name: test-pr-e2e

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - development

# Add permissions for GitHub Container Registry
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Check if PR is from external fork (different repository)
  # A PR is from an external fork if head and base repos are different
  # PRs within the same fork (to main) will have same head/base repo
  IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}

jobs:
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Monaco workers
        run: npm run build-monaco-workers

      - name: Start app
        run: npm run dev:webpack -- -p 3000 > app.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http://127.0.0.1:3000 -t 120000

      - name: Smoke check homepage
        run: curl -fsS http://127.0.0.1:3000 > /dev/null

      - name: Print app logs on failure
        if: failure()
        run: cat app.log

  build-frontend:
    needs: e2e-smoke
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.set-image-name.outputs.image_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${REPO_OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "Repository owner (lowercase): ${REPO_OWNER_LOWER}"

      - name: Extract version from package.json
        id: get-version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Set image name
        id: set-image-name
        run: |
          if [[ "${{ env.IS_FORK }}" == "true" ]]; then
            echo "image_name=keep-frontend:local" >> $GITHUB_OUTPUT
          else
            echo "image_name=ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        if: ${{ env.IS_FORK != 'true' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Set cache key variables
        id: cache-keys
        run: |
          # Create a safe branch name for cache key (replace / with - and remove special chars)
          SAFE_BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]//g')
          echo "SAFE_BRANCH_NAME=${SAFE_BRANCH}" >> $GITHUB_OUTPUT

          # Create a hash ONLY of the dependencies section of package.json and package-lock.json
          # This ensures the hash only changes when dependencies change
          DEPS_HASH=$(jq '.dependencies' package.json | sha256sum | cut -d ' ' -f 1)
          echo "DEPS_HASH=${DEPS_HASH:0:8}" >> $GITHUB_OUTPUT

      - name: Debug repository and cache info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Branch: ${{ github.head_ref || github.ref_name }}"
          echo "Safe branch name: ${{ steps.cache-keys.outputs.SAFE_BRANCH_NAME }}"
          echo "Dependencies hash: ${{ steps.cache-keys.outputs.DEPS_HASH }}"
          echo "Is fork: ${{ env.IS_FORK }}"

      # Pre-check if branch cache exists (only for non-forks)
      - name: Check if branch cache exists
        id: branch-cache-exists
        if: ${{ env.IS_FORK != 'true' }}
        continue-on-error: true
        run: |
          BRANCH_CACHE_TAG="ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:cache-${{ steps.cache-keys.outputs.SAFE_BRANCH_NAME }}"
          if docker buildx imagetools inspect "$BRANCH_CACHE_TAG" &>/dev/null; then
            echo "Branch cache exists: $BRANCH_CACHE_TAG"
            echo "cache_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Branch cache does not exist: $BRANCH_CACHE_TAG"
            echo "cache_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Log frontend cache status
        if: ${{ env.IS_FORK != 'true' }}
        run: |
          if [ "${{ steps.branch-cache-exists.outputs.cache_exists }}" == "true" ]; then
            echo "FRONTEND CACHE HIT ✅"
            echo "Cache tag: ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:cache-${{ steps.cache-keys.outputs.SAFE_BRANCH_NAME }}"
          else
            echo "FRONTEND CACHE MISS ❌"
            echo "Will attempt to use main branch cache and create a new branch cache"
          fi

      # For non-forks: Build and push to registry
      - name: Build and push frontend image with registry cache
        if: ${{ env.IS_FORK != 'true' }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:${{ steps.get-version.outputs.version }}
          # Debug: Print what we're pushing
          metadata: |
            labels.docker.image="${{ steps.repo-owner.outputs.owner }}/keep-frontend:${{ github.sha }}"
          # Use registry-based caching with branch-specific tags
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:cache-${{ steps.cache-keys.outputs.SAFE_BRANCH_NAME }}
            type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:cache-${{ steps.cache-keys.outputs.DEPS_HASH }}
            type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:cache-main
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:cache-${{ steps.cache-keys.outputs.SAFE_BRANCH_NAME }},mode=max
            type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/keep-frontend:cache-${{ steps.cache-keys.outputs.DEPS_HASH }},mode=max
          # Add build args for better caching
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          # Verbose output
          outputs: type=image,push=true
